<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=3.0, user-scalable=yes" />
  <title>MindCare — Cognitive & Daily Routine Companion</title>
  <meta name="description" content="MindCare is an accessible cognitive and routine assistance platform designed for elderly individuals living with dementia and their caregivers." />
  <link rel="stylesheet" href="./css/style.css" />
  <!-- Preconnect to improve responsiveness -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌿</text></svg>" />
</head>
<body>
  <!-- Header with Accessibility Controls -->
  <div id="headerRoot"></div>

  <!-- Main Patient / Caregiver Content Area -->
  <main class="container" id="mainContentRoot" style="padding-top: 24px; padding-bottom: 60px; flex: 1;">
    <div style="text-align: center; padding: 60px 20px;">
      <div style="font-size: 48px; margin-bottom: 16px;">🌿</div>
      <h2>Opening MindCare...</h2>
      <p style="color: var(--text-muted); font-size: var(--font-base); margin-top: 8px;">
        Setting up your personalized routine and activities...
      </p>
    </div>
  </main>

  <!-- Live Announcer for Screen Readers & Assistive Devices -->
  <div id="ariaLiveRegion" class="sr-only" aria-live="polite" aria-atomic="true"></div>

  <!-- Application Bootstrap -->
  <script type="module" src="./js/app.js"></script>
</body>
</html>
